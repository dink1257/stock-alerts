name: Hello Bark Test

on:
  workflow_dispatch:   # 手动触发

jobs:
  test-bark:
    # 只在 dev/refactor 分支运行
    if: github.ref == 'refs/heads/dev/refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Bark 推送测试
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          curl -X GET "$BARK_URL/Hello%20Bark/这是一条测试推送"

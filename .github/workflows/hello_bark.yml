name: 🚀 Hello Bark Test

on:
  workflow_dispatch:

jobs:
  test-bark-push: # 统一使用这个任务名称
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔔 Test Bark Notification
        run: |
          # 🚨 步骤 1：请将 aBcDeFgHiJkLmNoP 替换为您自己的实际 Key
          BARK_KEY=aBcDeFgHiJkLmNoP 
          
          # 步骤 2：构造完整的 URL
          FULL_URL="https://api.day.app/${BARK_KEY}/GitHub Action Test/Push successful!"
          
          # 步骤 3：打印 URL 供检查 (关键调试步骤)
          echo "Debug URL: $FULL_URL" 
          
          # 步骤 4：执行 cURL
          curl -f "$FULL_URL" 
          
          # 步骤 5：检查 cURL 退出状态
          if [ $? -ne 0 ]; then
            echo "--- Bark 推送失败！请检查 Debug URL 是否正确！---"
            exit 1 
          fi
          echo "Bark 推送命令执行成功。"

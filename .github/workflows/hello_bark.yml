name: 🚀 Hello Bark Test (Final Secure Version)

on:
  workflow_dispatch:

jobs:
  test-bark-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔔 Test Bark Notification
        run: |
          # 🚨 步骤 1：从您的 Secret 'BARK_URL' 中获取完整的推送链接
          # BARK_URL 变量现在安全地包含了您的 Key 和基础 URL。
          BARK_URL="${{ secrets.BARK_URL }}"
          
          # 步骤 2：构造完整的 URL
          # 直接在 Secret URL 后面拼接消息，并进行 URL 编码
          FULL_URL="${BARK_URL}GitHub%20Action%20Test/Push%20successful!"
          
          # 步骤 3：打印 URL 供检查 (日志中将显示 ***** 而不是您的 Key)
          echo "Debug URL: $FULL_URL" 
          
          # 步骤 4：执行 cURL
          # -f: 确保 4xx/5xx 错误时任务失败
          curl -fs "$FULL_URL" 
          
          # 步骤 5：检查 cURL 退出状态
          if [ $? -ne 0 ]; then
            echo "--- Bark 推送失败！请检查您的 Secret 内容是否为完整的 URL。---"
            exit 1 
          fi
          echo "Bark 推送命令执行成功，请检查手机！"

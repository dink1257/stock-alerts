name: Stock News & AI Analysis

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分钟运行一次
  workflow_dispatch:          # 可以手动触发
jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests dashscope

      - name: Run AI news analysis
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          python news.py

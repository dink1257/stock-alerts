name: Real-Time Alerts
on:
  schedule:
    - cron: "*/5 * * * 1-5" # 交易日每5分钟
  workflow_dispatch:
jobs:
  run_monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/refactor
      - name: Run
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          pip install yahooquery requests pytz
          python fetch_prices.py

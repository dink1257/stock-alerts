name: Stock Alerts (5-min Real-Time)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 1-5"

jobs:
  stock_alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install yahooquery requests dashscope

      - name: Run real-time price monitor
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python fetch_prices.py

# 在 stock_alerts.yml 的最后增加这些步骤
    permissions:
      contents: write # 必须赋予写权限，否则无法记录预警等级

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/refactor
      # ... 原有的 pip install 和 python run ...
      - name: Save Alert State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/alert_state.json || true
          git commit -m "Update alert levels [skip ci]" || true
          git push

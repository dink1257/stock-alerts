name: Stock Alerts (5-min Real-Time)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 1-5"

jobs:
  stock_alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install yahooquery requests dashscope exchange_calendars pytz pandas

      - name: Run real-time price monitor
        id: price_monitor  # 🚩 必须有这个 ID 才能传递信号
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WATCHLIST_PATH: "data/watchlist.csv" # 确保路径正确
        run: python fetch_prices.py

      - name: 🚀 Trigger AI News Analysis
        # 🚩 只有当 Python 脚本发出 alert_triggered=true 时才执行
        if: steps.price_monitor.outputs.alert_triggered == 'true'
        env:
          # 使用你刚才生成的 1 年期万能钥匙
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "检测到股价异常，正在唤醒 AI 分析逻辑..."
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ai_news.yml/dispatches \
            -d '{"ref":"dev/refactor"}'

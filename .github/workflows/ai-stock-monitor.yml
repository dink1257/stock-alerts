name: CIO Decision Hub (V6.0.0)

on:
  workflow_dispatch: # 支持手动一键启动测试
  schedule:
    # 1. 盘前全量筛选（08:26）：所有标的一次性深度审计，锁定今日机会与风险
    - cron: "26 0 * * 1-5" 
    
    # 2. 早盘异动监控（10:12 / 11:02）：精准捕捉开盘一小时后的逻辑确认
    - cron: "12 2 * * 1-5"
    - cron: "02 3 * * 1-5"
    
    # 3. 午间逻辑梳理（12:42）：审计午间公告与港股联动
    - cron: "42 4 * * 1-5"
    
    # 4. 尾盘策略锁定（14:38）：针对大股东异动，给出收盘博弈建议
    - cron: "38 6 * * 1-5"
    
    # 5. 美股穿透审计（22:18）：扫描隔夜中概股及全球宏观映射
    - cron: "18 14 * * 1-5"

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 调高上限，为 Qwen-Max 的深度思考留足时间
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: pip install requests pytz yahooquery
        
      - name: Execute CIO Audit
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }} # 必须是百炼新 Key
          WATCHLIST_PATH: "data/watchlist.csv"
        run: python debug_bridge.py
        
      - name: Sync Audit State
        # 即使报错也尝试保存状态，防止重复推送
        if: always() 
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || true
          git add data/alert_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update audit state [skip ci]" && git push)

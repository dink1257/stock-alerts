name: Global Macro & CIO Asset Monitor

on:
  workflow_dispatch:
  schedule:
    # --- A股早盘 (北京时间 09:03 - 11:33) ---
    - cron: "3,13,23,33,43,53 1-3 * * 1-5"
    
    # --- 午间休市窗口 (北京时间 12:48) ---
    - cron: "48 4 * * 1-5"
    
    # --- A股下午盘 (北京时间 13:03 - 15:53) ---
    - cron: "3,13,23,33,43,53 5-7 * * 1-5"
    
    # --- 早晨 CIO 内参 (北京时间 08:26) ---
    - cron: "26 0 * * 1-5"
    
    # --- 美股监控 (北京时间 21:30 - 04:30) ---
    - cron: "4,14,24,34,44,54 13-20 * * 1-5"
    - cron: "4,14,24 21 * * 1-5"

# --- 核心修复 1：显式赋予自动运行任务（Schedule）写权限 ---
permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # --- 核心修复 2：解决自动运行超时问题 ---
    timeout-minutes: 20
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          # 确保拉取最新代码，防止自动运行时状态冲突
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pytz yahooquery

      - name: Run CIO Monitor
        env:
          # --- 核心修复 3：确保 Secret 环境变量在自动模式下被强制载入 ---
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          WATCHLIST_PATH: "data/watchlist.csv"
        # 使用 -u 参数确保 Python 日志实时打印，不被 GitHub 误杀
        run: python -u main_scheduler.py

      - name: Commit and Push State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 尝试同步最新状态，防止多任务并发冲突
          git pull --rebase origin main || true
          
          # 只有在状态文件确实有变动时才提交，避免无效记录
          git add data/alert_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update monitor state [skip ci]" && git push)

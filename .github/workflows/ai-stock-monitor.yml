name: AI Stock Monitor Pipeline

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stock-analysis-service:
    name: Market Analysis & AI Insight
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Production Dependencies
        run: |
          pip install requests yahooquery pytz

      - name: 4. Execute AI Intelligence Scheduler
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          WATCHLIST_PATH: "data/watchlist.csv"
        run: python main_scheduler.py

      - name: 5. Synchronize Execution State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "stock-ai-bot"
          git add data/alert_state.json || true
          if git diff --staged --quiet; then
            echo "No state changes detected. Skipping commit."
          else
            git commit -m "chore: update market alert state [skip ci]"
            git push
          fi

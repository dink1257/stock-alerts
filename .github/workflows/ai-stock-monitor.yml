name: Global Macro & CIO Asset Monitor

on:
  workflow_dispatch:
  schedule:
    # --- A股早盘 & 午前 (北京时间 09:03 - 11:33) ---
    - cron: "3,13,23,33,43,53 1-3 * * 1-5"
    
    # --- 午间休市窗口期 (北京时间 12:48 运行一次) ---
    - cron: "48 4 * * 1-5"
    
    # --- A股下午盘 (北京时间 13:03 - 15:53) ---
    - cron: "3,13,23,33,43,53 5-7 * * 1-5"
    
    # --- 早晨 CIO 内参 (北京时间 08:26) ---
    - cron: "26 0 * * 1-5"
    
    # --- 美股核心监控区 (北京时间 21:30 - 04:30) ---
    - cron: "4,14,24,34,44,54 13-20 * * 1-5"
    - cron: "4,14,24 21 * * 1-5"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 增加到10分钟，防止AI分析耗时导致被强制关闭
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pytz yahooquery

      - name: Run CIO Monitor
        env:
          # --- 核心修改：切换为飞书 Webhook ---
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          WATCHLIST_PATH: "data/watchlist.csv"
        run: python main_scheduler.py

      - name: Commit and Push State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 确保如果文件不存在也会尝试添加，且由于skip ci不会导致死循环
          git add data/alert_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update monitor state [skip ci]" && git push)

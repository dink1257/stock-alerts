name: 财经监控CIO版

on:
  schedule:
    # A. 盘前全量 (08:30-09:20)
    - cron: "30,40,50 0 * * 1-5"
    # B. A/港早盘 (09:30-11:40)
    - cron: "*/10 1-3 * * 1-5"
    # C. A/港下午盘 (13:00-15:10)
    - cron: "*/10 5-7 * * 1-5"
    # D. 美股开/收盘窗 (自动适配冬夏令时)
    - cron: "0,10,20,30,40 13-14 * * 1-5"
    - cron: "30,40,50 19-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cio_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install requests pytz  # 仅保留这两个核心库

      - name: Execute CIO Smart Audit
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          WATCHLIST_PATH: "data/watchlist.csv"
        run: python -u main_scheduler.py

      - name: Sync Audit State
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/alert_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "update state [skip ci]" && git push)

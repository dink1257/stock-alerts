name: CIO Decision Hub (V6.8.5)

# 核心调度策略：
# 1. 强制全量审计：08:30 (盘前定调) & 12:45 (盘中修正)
# 2. 阶梯异动监测：交易时段每 10 分钟扫描，无异动/未翻倍则略过
on:
  schedule:
    # A. 北京时间 08:30 (UTC 00:30) - 早盘全量强制审计
    - cron: "30 0 * * 1-5"
    
    # B. 北京时间 09:30 - 11:40 (UTC 01:30 - 03:40) - 盘中高频监测
    - cron: "*/10 1-3 * * 1-5"
    
    # C. 北京时间 12:45 (UTC 04:45) - 午间强制全量审计
    - cron: "45 4 * * 1-5"
    
    # D. 北京时间 13:00 - 15:10 (UTC 05:00 - 07:10) - 盘中高频监测
    - cron: "*/10 5-7 * * 1-5"

  workflow_dispatch: # 保留手动触发用于验证

permissions:
  contents: write
  actions: write

jobs:
  cio_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Critical Dependencies
        run: pip install -r requirements.txt

      - name: Execute CIO Smart Audit
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          WATCHLIST_PATH: "data/watchlist.csv"
        # -u 确保日志实时输出，方便在 Actions 页面查阅“静默”日志
        run: python -u main_scheduler.py

      - name: Sync Audit State
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || true
          git add data/alert_state.json || true
          # 仅在阶梯触发导致状态更新时才提交代码，避免污染提交历史
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CIO state [skip ci]" && git push)

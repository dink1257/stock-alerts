name: CIO Daily Monitor (V5.7.9)

on:
  workflow_dispatch:
  schedule:
    - cron: "26 0 * * 1-5"      # 08:26 审计
    - cron: "5,35 1-2 * * 1-5"  # 早盘
    - cron: "48 4 * * 1-5"      # 午间
    - cron: "5,35 5-7 * * 1-5"  # 下午盘
    - cron: "34 13-15 * * 1-5" # 美股

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install requests pytz yahooquery
      - name: Execution
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python -u main_scheduler.py
      - name: State Sync
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || true
          git add data/alert_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state [skip ci]" && git push)

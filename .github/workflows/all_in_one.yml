name: AI_Stock_Master

on:
  schedule:
    - cron: "*/5 * * * *"  # 每5分钟运行一次，由脚本内部判断是否属于交易时段
  workflow_dispatch:       # 允许你在 UI 界面点击按钮手动测试

permissions:
  contents: write         # 必须：允许脚本更新 alert_state.json 并推送到仓库

jobs:
  run_main_logic:         # 任务 ID
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests yahooquery pytz

      - name: Run Intelligent Scheduler
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          WATCHLIST_PATH: "data/watchlist.csv"
        run: python main_scheduler.py

      - name: Sync and Commit State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/alert_state.json || true
          git commit -m "Update alert state [skip ci]" || true
          git push || true
